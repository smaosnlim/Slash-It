name: EAS Update
on:
  push:
    branches:
      - main  # Trigger on push to main branch; adjust as needed
jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm 

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci 

      - name: Publish update
        run: eas update --branch main --message "Auto-deployed update from commit ${{ github.sha }}"
