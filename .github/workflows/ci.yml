name: CI

on:
  push:
    branches: [system-test]
  pull_request:
    branches: [system-test]

jobs:
  test:
    name: Run Jest Tests
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Use a recent Node.js version compatible with Expo
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Run Jest tests
      - name: Run tests
        run: npm test

      # Optional: Upload test results as an artifact (useful for debugging)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/junit.xml
            **/*.log
